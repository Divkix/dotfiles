providers:
  autoThinkingMaxEffort: xhigh
  anthropic:
    serverSideFallback: false
  tinyModelDevice: auto
  openai-codex:
    codeMode: auto
setupVersion: 2
modelRoles:
  slow: openai-codex/gpt-5.6-sol:high
  task: opencode-go/mimo-v2.6-flash:high
  default: opencode-go/deepseek-v4.1-flash:max
  web: web/firecrawl
  judge: typesafe/jev-latest
  smol: opencode-go/mimo-v2.6-flash:auto
  image: openrouter/meta/muse-image:auto
defaultThinkingLevel: auto
advisor:
